# DSA5205 Project 2 - Integrated four-model experiment configuration
# -------------------------------------------------------------------
# All periods are fixed a priori. Changing them invalidates the
# selection contract and requires a full re-run.

project:
  name: DSA5205_Project2_Four_Model_Comparison
  frequency: monthly
  random_seed: 42

data:
  # Chronological split (decision dates). The label embargo rule below
  # additionally requires a label to be *realized* before the boundary.
  train_start: "2010-01-01"
  train_end_exclusive: "2020-01-01"
  validation_start: "2020-01-01"
  validation_end_exclusive: "2022-01-01"
  refit_end_exclusive: "2022-01-01"
  test_start: "2022-01-01"
  test_end_exclusive: "2026-01-01"
  research_end: "2025-12-31"

  # "strict_cutoff": a row may be used for fitting/tuning only if
  # label_end_date <= the split boundary. This is the original
  # pipeline convention and is deliberately conservative.
  label_embargo: strict_cutoff

  model_ready_dir: "data/processed_ready"
  extension_panel: "data/derived/extension_top300_labeled.parquet"
  full_feature_panel: "data/processed_with_nan/full_feature_panel.parquet"
  raw_market_data: "data/raw/market_data.parquet"

  # Original screening / universe rules (copied from config/pipeline.json).
  liquid_universe_size: 300
  min_eligible_stocks: 90
  min_price: 5.0
  min_adv20: 10000000.0
  min_coverage: 0.95
  benchmarks: ["SPY", "QQQ"]

target: "target_forward_return"

portfolio:
  # Original trading rules - DO NOT CHANGE.
  top_n: 10
  weighting: "equal"
  cost_bps_per_side: 20
  turnover_definition: "sum_abs_weight_change"
  execution: "next_open_after_decision"
  benchmark_cost: "one_time_entry_only"

models:
  ridge:
    grid:
      alpha: [0.1, 1.0, 10.0, 100.0, 1000.0, 10000.0]
  lasso:
    grid:
      alpha: [0.00001, 0.0001, 0.001, 0.01, 0.1]
    max_iter: 20000
  rf:
    grid:
      max_depth: [3, 6]
      min_samples_leaf: [10, 25]
    n_estimators: 250
    max_features: 0.7
  xgb:
    # n_estimators is a tuned dimension here (the original pipeline fixed
    # it at 200). The grid stays small: 2 x 2 x 2 = 8 configurations.
    grid:
      max_depth: [2, 3]
      learning_rate: [0.03, 0.1]
      n_estimators: [100, 200]
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 10.0
    tree_method: "hist"

selection:
  # Within-family hyperparameter criterion.
  criterion: "lowest_validation_mse"
  allowed_criteria:
    - "lowest_validation_mse"
    - "highest_validation_sharpe"

paths:
  results: "results"
  validation: "results/validation"
  validation_figures: "results/validation/figures"
  oos: "results/oos"
  oos_figures: "results/oos/figures"
  ridge_extension: "results/extensions"
  ridge_extension_figures: "results/extensions/figures"
  models: "results/models"
  research_diagnostics: "results/diagnostics"
  eight_strategy: "results/oos/eight_strategy"
